# FASAS Digitale in container: database, sito, job periodici e proxy HTTPS. Guida: docs/CONTAINER.md
#   cp .env.example .env    (compilare chiavi, dominio e password)
#   docker compose up -d --build
name: fasas

x-app: &app
  build: .
  image: fasas-digitale:${FASAS_VERSION:-locale}
  env_file: .env
  environment:
    DATABASE_URL: postgres://fasas:${POSTGRES_PASSWORD:?impostare POSTGRES_PASSWORD in .env}@db:5432/fasas
    FASAS_RESTORE_TEST_DATABASE_URL: postgres://fasas:${POSTGRES_PASSWORD}@db:5432/fasas_prova_ripristino
    CELERY_BROKER_URL: redis://redis:6379/0
    DJANGO_ALLOWED_HOSTS: ${FASAS_DOMAIN:-localhost},127.0.0.1,web
    DJANGO_CSRF_TRUSTED_ORIGINS: https://${FASAS_DOMAIN:-localhost}
    FASAS_TRUSTED_PROXY_COUNT: "1"
  volumes:
    - fasas-data:/data
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: ${FASAS_POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_DB: fasas
      POSTGRES_USER: fasas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?impostare POSTGRES_PASSWORD in .env}
    volumes:
      - fasas-db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasas -d fasas"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    <<: *app
    command: ["web"]
    volumes:
      - fasas-data:/data
      - fasas-static:/static

  worker:
    <<: *app
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:  # parte dopo il sito, che applica le migrazioni e prepara il volume dei dati
      web:
        condition: service_healthy
      redis:
        condition: service_started

  proxy:
    image: caddy:2
    environment:
      FASAS_DOMAIN: ${FASAS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - fasas-static:/static:ro
      - caddy-data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  fasas-db:
  fasas-data:
  fasas-static:
  caddy-data:
