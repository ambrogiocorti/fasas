{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
{% include "personal/_guest_head.html" with compact=True %}
<div class="card" style="max-width: 980px">
  <div class="card-head"><h1>{{ page_title }}</h1></div>
  {% if intro %}<p class="muted">{{ intro }}</p>{% endif %}
  <form method="post"{% if multipart or form.is_multipart %} enctype="multipart/form-data"{% endif %} novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">{{ submit_label|default:"Salva" }}</button>
      <a class="btn" href="{{ cancel_url }}">Annulla</a>
    </div>
  </form>
</div>
{% endblock %}
