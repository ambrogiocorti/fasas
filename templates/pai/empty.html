{% extends "base.html" %}
{% block title %}{{ guest }} – PAI{% endblock %}
{% block content %}
{% include "guests/_header.html" %}

  <p>Nessun Piano Assistenziale Individuale per questo ospite.</p>

</div>
{% endblock %}
