name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fasas
          POSTGRES_PASSWORD: fasas
          POSTGRES_DB: fasas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      FASAS_ENCRYPTION_KEYS: Y2ktb25seS1mYXNhcy1lbmNyeXB0aW9uLWtleS0wMDA=
      FASAS_BACKUP_KEY: Y2ktb25seS1mYXNhcy1iYWNrdXAta2V5LTAwMDAwMDA=
      FASAS_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: SoftHSM2 (modulo PKCS#11 reale per i test del FASAS Signer)
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install "moto[s3]>=5.0" "ruff>=0.6" -r signer/requirements.txt
      - run: ruff check fasas config signer
      - name: Imposta database
        if: matrix.database == 'postgres'
        run: echo "DATABASE_URL=postgres://fasas:fasas@localhost:5432/fasas" >> "$GITHUB_ENV"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy
      - run: python manage.py test fasas.tests

  test-windows:
    # Verifica che il sistema funzioni anche sui PC Windows della comunità
    runs-on: windows-latest
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      FASAS_ENCRYPTION_KEYS: Y2ktb25seS1mYXNhcy1lbmNyeXB0aW9uLWtleS0wMDA=
      FASAS_BACKUP_KEY: Y2ktb25seS1mYXNhcy1iYWNrdXAta2V5LTAwMDAwMDA=
      FASAS_LOG_LEVEL: WARNING
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py migrate --verbosity 0
      - run: python manage.py fasas_demo --skip-if-exists --ambiente-di-prova
      - run: python manage.py test fasas.tests

  container:
    # Immagine di produzione e docker compose completo: database, sito, job, proxy HTTPS.
    # PostgreSQL 16 con client 17: prova anche il ripristino verso un server più vecchio (es. Supabase).
    runs-on: ubuntu-latest
    env:
      FASAS_POSTGRES_IMAGE: postgres:16
    steps:
      - uses: actions/checkout@v4
      - name: Configurazione di prova (chiavi generate al momento, mai usate altrove)
        run: |
          python3 -c "import base64,os,secrets; print('DJANGO_DEBUG=0'); print('DJANGO_SECRET_KEY=' + secrets.token_hex(32)); print('FASAS_ENCRYPTION_KEYS=' + base64.urlsafe_b64encode(os.urandom(32)).decode()); print('FASAS_BACKUP_KEY=' + base64.urlsafe_b64encode(os.urandom(32)).decode()); print('POSTGRES_PASSWORD=' + secrets.token_hex(16)); print('FASAS_DOMAIN=localhost'); print('FASAS_HEALTH_TOKEN=ci')" > .env
      - run: docker compose build
      - run: docker compose up -d
      - name: Attende il sito
        run: |
          for i in $(seq 1 60); do
            curl -skf https://localhost/salute/ && break
            sleep 3
          done
          curl -skf https://localhost/accesso/entra/ > /dev/null
          curl -skf https://localhost/static/css/fasas.css > /dev/null
      - name: Backup PostgreSQL (pg_dump), verifica audit e prova di ripristino in un database separato
        run: |
          docker compose exec -T web python manage.py fasas_jobs audit_verify backup
          docker compose exec -T web python manage.py backup_prova_ripristino
          docker compose exec -T web pg_dump --version
      - name: Stato dettagliato
        run: curl -sk "https://localhost/salute/?token=ci"
      - name: Log in caso di errore
        if: failure()
        run: docker compose logs --tail 100
      - run: docker compose down -v
        if: always()

  installazione:
    # scripts/prepara_server.sh su un vero Ubuntu 24.04 con Docker, come nella guida d'installazione in struttura.
    # Dominio .localhost (certificato locale di Caddy), senza DuckDNS, firewall né backup fuori sede.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prima installazione
        run: >
          sudo python3 .github/ci/prova_prepara_server.py . '[["Indirizzo del FASAS", "fasas.localhost"],
          ["Rete della struttura \\[", "192.168.77.0/24"], ["Email", "direzione@esempio.it"],
          ["bucket B2", "n"], ["Attivo il firewall", "n"], ["Riavvio automatico", "n"]]'
      - name: Controlli dopo l'installazione
        run: |
          test "$(sudo stat -c %a .env)" = 600
          sudo grep -Eq '^FASAS_VAPID_PRIVATE_KEY=.{40,}$' .env
          sudo grep -q '^FASAS_2FA_TRUSTED_NETWORKS=192.168.77.0/24$' .env
          curl -skf --resolve fasas.localhost:443:127.0.0.1 https://fasas.localhost/salute/
          curl -skf --resolve fasas.localhost:443:127.0.0.1 https://fasas.localhost/accesso/entra/ > /dev/null
          sudo docker compose exec -T web python manage.py fasas_chiavi verifica
      - name: Rilancio dello script (le chiavi non devono cambiare)
        run: |
          sudo sha256sum .env > /tmp/env-prima
          sudo python3 .github/ci/prova_prepara_server.py . '[["Attivo il firewall", "n"], ["Riavvio automatico", "n"]]'
          sudo sha256sum .env | diff - /tmp/env-prima
          sudo docker compose exec -T web python manage.py fasas_chiavi verifica
      - name: Disco di continuità (disco virtuale al posto dell'SSD USB)
        run: |
          truncate -s 4G /tmp/disco-continuita.img
          DEV=$(sudo losetup -f --show /tmp/disco-continuita.img)
          sudo ./scripts/disco_continuita.sh --prepara "$DEV" --si
          sudo grep -q '^FASAS_CONTINUITY_DIR=/continuita$' .env
          sudo docker compose up -d
          for i in $(seq 1 60); do sudo docker compose exec -T worker true 2>/dev/null && break; sleep 2; done
          sudo docker compose exec -T worker python manage.py fasas_jobs continuity
          sudo ./scripts/disco_continuita.sh --stato
          sudo find /srv/fasas-continuita/database -name 'fasas-continua-*.fbk' | grep -q .
          sudo docker compose exec -T web python manage.py fasas_ripristina_continuita --elenca | grep -q fasas-continua-
      - name: Gruppo di continuità (NUT con un gruppo simulato al posto di quello USB)
        run: |
          sudo ./scripts/gruppo_continuita.sh --configura --simulato
          sudo grep -q '^FASAS_UPS_STATUS_FILE=/ups/stato.json$' .env
          for i in $(seq 1 30); do sudo ./scripts/gruppo_continuita.sh --stato | grep -q "rete elettrica" && break; sleep 2; done
          sudo ./scripts/gruppo_continuita.sh --stato
          # manca la corrente: evento scritto per il FASAS e avviso letto dal job
          printf 'battery.charge: 90\nbattery.runtime: 1500\nups.status: OB\n' | sudo tee /etc/nut/fasas-prova.dev
          for i in $(seq 1 30); do sudo grep -q ONBATT /srv/fasas-ups/stato.json && break; sleep 2; done
          sudo grep -q ONBATT /srv/fasas-ups/stato.json
          sudo docker compose up -d
          for i in $(seq 1 60); do sudo docker compose exec -T worker true 2>/dev/null && break; sleep 2; done
          sudo docker compose exec -T worker python manage.py fasas_jobs ups | grep -q ONBATT
          # batteria sotto la soglia: spegnimento ordinato (qui simulato con un file)
          printf 'battery.charge: 30\nbattery.runtime: 900\nups.status: OB\n' | sudo tee /etc/nut/fasas-prova.dev
          for i in $(seq 1 30); do test -f /run/fasas-spegnimento-simulato && break; sleep 2; done
          test -f /run/fasas-spegnimento-simulato
      - name: Manutenzione del mese (backup, contenitori aggiornati, controllo)
        run: |
          sudo ./scripts/aggiorna_fasas.sh --controlla
          sudo ./scripts/aggiorna_fasas.sh --solo-sicurezza
          sudo grep -q "aggiornamento completato" /var/log/fasas-aggiornamenti.log
          curl -skf --resolve fasas.localhost:443:127.0.0.1 https://fasas.localhost/salute/
      - name: VPN di manutenzione (un «PC di casa» simulato in una rete separata)
        run: |
          sudo ./scripts/accesso_remoto.sh --configura --indirizzo 10.200.0.1
          sudo ./scripts/accesso_remoto.sh --aggiungi pc-casa
          # «casa»: rete separata, collegata al server solo da un cavo virtuale verso la porta UDP della VPN
          sudo ip netns add casa
          sudo ip link add veth-server type veth peer name veth-casa
          sudo ip link set veth-casa netns casa
          sudo ip addr add 10.200.0.1/24 dev veth-server
          sudo ip link set veth-server up
          sudo ip -n casa addr add 10.200.0.2/24 dev veth-casa
          sudo ip -n casa link set veth-casa up
          sudo ip -n casa link set lo up
          if sudo ip netns exec casa ping -c1 -W2 10.77.0.1; then echo "server raggiungibile senza VPN"; exit 1; fi
          sudo install -d -m 700 /etc/wg-casa
          sudo cp "$HOME/fasas-pc-casa.conf" /etc/wg-casa/casa.conf
          sudo ip netns exec casa wg-quick up /etc/wg-casa/casa.conf
          sudo ip netns exec casa ping -c3 -W5 10.77.0.1
          sudo ./scripts/accesso_remoto.sh --elenca | grep pc-casa | grep -q "ultimo collegamento"
          sudo ./scripts/accesso_remoto.sh --stato
          # accesso tolto: lo stesso PC non passa più
          sudo ./scripts/accesso_remoto.sh --rimuovi pc-casa
          if sudo ip netns exec casa ping -c2 -W3 10.77.0.1; then echo "accesso tolto ma ancora attivo"; exit 1; fi
          sudo ./scripts/accesso_remoto.sh --elenca
      - name: Log in caso di errore
        if: failure()
        run: sudo docker compose logs --tail 100
      - run: sudo docker compose down -v
        if: always()

  sicurezza:
    # Vulnerabilità note nelle dipendenze bloccate e analisi statica del codice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      - run: pip-audit --require-hashes --disable-pip -r requirements.lock
      - run: pip-audit --require-hashes --disable-pip -r signer/requirements.lock
      - run: bandit -q -r fasas config signer/fasas_signer -x fasas/tests,*/migrations/* -ll
