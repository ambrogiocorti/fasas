name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fasas
          POSTGRES_PASSWORD: fasas
          POSTGRES_DB: fasas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      FASAS_ENCRYPTION_KEYS: Y2ktb25seS1mYXNhcy1lbmNyeXB0aW9uLWtleS0wMDA=
      FASAS_BACKUP_KEY: Y2ktb25seS1mYXNhcy1iYWNrdXAta2V5LTAwMDAwMDA=
      FASAS_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check fasas config
      - name: Imposta database
        if: matrix.database == 'postgres'
        run: echo "DATABASE_URL=postgres://fasas:fasas@localhost:5432/fasas" >> "$GITHUB_ENV"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy
      - run: python manage.py test fasas.tests

  test-windows:
    # Verifica che il sistema funzioni anche sui PC Windows della comunità
    runs-on: windows-latest
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      FASAS_ENCRYPTION_KEYS: Y2ktb25seS1mYXNhcy1lbmNyeXB0aW9uLWtleS0wMDA=
      FASAS_BACKUP_KEY: Y2ktb25seS1mYXNhcy1iYWNrdXAta2V5LTAwMDAwMDA=
      FASAS_LOG_LEVEL: WARNING
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --verbosity 0
      - run: python manage.py fasas_demo --skip-if-exists
      - run: python manage.py test fasas.tests
