name: App FASAS Signer

# App congelate finché la firma con CIE resta spenta (pilota): si compilano solo a mano, da GitHub
# (Actions › App FASAS Signer › Run workflow), per esempio prima del collaudo con una CIE reale.
on:
  workflow_dispatch:

jobs:
  android:
    # APK di PROVA (build debug) e, se ci sono i segreti con la chiave della struttura, APK DEFINITIVO firmato
    # (build release, solo HTTPS) da pubblicare nel FASAS: Firma › Pubblica l'app (docs/FIRMA_CIE.md).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    env:
      FASAS_ANDROID_KEYSTORE_B64: ${{ secrets.FASAS_ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Libreria IAS (PagoPA/IPZS, licenza MIT) a versione fissata
        run: ./scripts/fetch_ias.sh
      - name: Test del protocollo FASAS
        run: gradle --no-daemon :signer-core:test
      - name: Numero di versione (cresce a ogni compilazione)
        run: |
          echo "FASAS_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "FASAS_VERSION_NAME=0.3.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: APK di prova
        run: gradle --no-daemon :app:assembleDebug
      - name: Il FASAS legge l'APK (pacchetto, versione, versione di prova)
        run: |
          python3 - app/build/outputs/apk/debug/app-debug.apk <<'PY'
          import os, sys
          sys.path.insert(0, "../../fasas/signatures")
          import apk
          info = apk.read_apk(sys.argv[1])
          print(info)
          assert info["package"] == "it.fasas.signer.android", info
          assert info["versionCode"] == int(os.environ["FASAS_VERSION_CODE"]), info
          assert info["versionName"] == os.environ["FASAS_VERSION_NAME"], info
          assert info["debuggable"] is True, info
          PY
      - name: APK definitivo firmato con la chiave della struttura
        if: env.FASAS_ANDROID_KEYSTORE_B64 != ''
        env:
          FASAS_KEYSTORE_PASSWORD: ${{ secrets.FASAS_KEYSTORE_PASSWORD }}
          FASAS_KEY_ALIAS: ${{ secrets.FASAS_KEY_ALIAS }}
          FASAS_KEY_PASSWORD: ${{ secrets.FASAS_KEY_PASSWORD }}
        run: |
          echo "$FASAS_ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fasas-signer.jks"
          export FASAS_KEYSTORE_FILE="$RUNNER_TEMP/fasas-signer.jks"
          gradle --no-daemon :app:assembleRelease
          rm -f "$RUNNER_TEMP/fasas-signer.jks"
          APK=app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | grep -i "sha-256"
          python3 - "$APK" <<'PY'
          import sys
          sys.path.insert(0, "../../fasas/signatures")
          import apk
          info = apk.read_apk(sys.argv[1])
          print(info)
          assert info["debuggable"] is False, info
          PY
      - name: Senza chiave della struttura niente APK definitivo
        if: env.FASAS_ANDROID_KEYSTORE_B64 == ''
        run: echo "::notice::Segreti FASAS_ANDROID_KEYSTORE_B64 e password non impostati: compilata solo la versione di prova (docs/FIRMA_CIE.md, «Distribuire l'app»)."
      - uses: actions/upload-artifact@v4
        if: env.FASAS_ANDROID_KEYSTORE_B64 != ''
        with:
          name: fasas-signer-android
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: fasas-signer-android-prova
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Schermate dell'app in chiaro e scuro (Paparazzi, senza telefono)
        continue-on-error: true
        env:
          FASAS_SCREENSHOTS: "1"
        run: |
          gradle --no-daemon -Pandroid.useAndroidX=true :app:recordPaparazziDebug
          ls app/src/test/snapshots/images/
      - uses: actions/upload-artifact@v4
        with:
          name: fasas-signer-android-schermate
          path: mobile/android/app/src/test/snapshots/images/
          retention-days: 30
          if-no-files-found: ignore

  schermate:
    # Le schermate in un foglio piccolo stampato nel log (base64): si controlla l'aspetto senza scaricare l'archivio
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fasas-signer-android-schermate
          path: schermate
      - name: Foglio compatto
        run: |
          command -v montage > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null)
          cd schermate
          montage $(ls *Light*abbinamento* *Light*pronto* *Light*avvicina* *Light*lettura*) \
            $(ls *Dark*pronto* *Dark*richiesta* *Dark*pin-fasas* *Dark*esito*) -tile 4x2 -geometry 240x+4+4 \
            -background '#808080' /tmp/f.png
          montage $(ls *Light*icona*) $(ls *Dark*icona*) -tile 1x2 -geometry +4+4 -background '#808080' /tmp/i.png
          convert /tmp/i.png -colors 64 PNG8:/tmp/i8.png
          echo "==ICONA $(stat -c %s /tmp/i8.png)"; base64 -w0 /tmp/i8.png; echo; echo "==FINE"
          convert /tmp/f.png -colors 48 PNG8:/tmp/f8.png
          echo "==FOGLIO $(stat -c %s /tmp/f8.png)"; base64 -w0 /tmp/f8.png; echo; echo "==FINE"

  ios:
    # Verifica che l'app per iPhone compili (senza firma: per installarla serve un account Apple Developer)
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: CieSDK (PagoPA, licenza MIT) con la patch per la firma e progetto Xcode
        run: ./scripts/prepare.sh
      - name: Compilazione per iPhone (senza firma)
        run: >
          xcodebuild -project FasasSigner.xcodeproj -scheme FasasSigner -configuration Debug
          -sdk iphoneos -destination "generic/platform=iOS"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet build
