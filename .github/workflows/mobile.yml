name: App FASAS Signer

# App congelate finché la firma con CIE resta spenta (pilota): si compilano solo a mano, da GitHub
# (Actions › App FASAS Signer › Run workflow), per esempio prima del collaudo con una CIE reale.
on:
  workflow_dispatch:

jobs:
  android:
    # APK di PROVA (build debug): da installare sul telefono per il collaudo con una CIE reale
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Libreria IAS (PagoPA/IPZS, licenza MIT) a versione fissata
        run: ./scripts/fetch_ias.sh
      - name: Test del protocollo FASAS
        run: gradle --no-daemon :signer-core:test
      - name: APK di prova
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fasas-signer-android-prova
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Schermate dell'app in chiaro e scuro (Paparazzi, senza telefono)
        continue-on-error: true
        env:
          FASAS_SCREENSHOTS: "1"
        run: |
          gradle --no-daemon :app:recordPaparazziDebug
          ls -la app/src/test/snapshots/images/
          # un foglio compatto per tema anche nel log (base64), per controllarle senza scaricare l'archivio
          command -v montage > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null)
          cd app/src/test/snapshots/images
          for theme in Light Dark; do
            montage *${theme}ScreensTest* -tile 4x2 -geometry 260x+6+6 -background '#888888' /tmp/foglio-$theme.jpg
            convert /tmp/foglio-$theme.jpg -quality 60 /tmp/foglio-$theme.jpg
            echo "==FOGLIO $theme $(stat -c %s /tmp/foglio-$theme.jpg)"; base64 -w0 /tmp/foglio-$theme.jpg; echo; echo "==FINE $theme"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fasas-signer-android-schermate
          path: mobile/android/app/src/test/snapshots/images/
          retention-days: 30
          if-no-files-found: ignore

  ios:
    # Verifica che l'app per iPhone compili (senza firma: per installarla serve un account Apple Developer)
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: CieSDK (PagoPA, licenza MIT) con la patch per la firma e progetto Xcode
        run: ./scripts/prepare.sh
      - name: Compilazione per iPhone (senza firma)
        run: >
          xcodebuild -project FasasSigner.xcodeproj -scheme FasasSigner -configuration Debug
          -sdk iphoneos -destination "generic/platform=iOS"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet build
