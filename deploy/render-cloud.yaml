# FASAS Digitale – versione cloud per i DATI VERI su Render (guida completa: docs/CLOUD.md; per fasas.online la
# soluzione consigliata è un VPS: docs/FASAS_ONLINE.md). Database: un progetto Supabase NUOVO e dedicato al FASAS.
# Render › New › Blueprint › questo repository, «Blueprint Path» = deploy/render-cloud.yaml (il render.yaml della
# cartella principale è la versione di presentazione): crea il servizio dal Dockerfile; le variabili con «sync: false»
# si compilano al primo avvio (valori dal passo 1-4 della guida), quelle con «generateValue» le crea Render.
#
# Piano: «free» non costa nulla ma il servizio si addormenta dopo un periodo senza visite (la prima pagina dopo la
# pausa arriva in circa un minuto) e i job pianificati girano solo da sveglio (al risveglio il FASAS recupera quelli
# saltati, backup compreso). Per l'uso reale con gli ospiti scegliere un piano a pagamento sempre acceso
# (es. «starter»): è una decisione della struttura, va autorizzata prima di cambiarlo.
services:
  - type: web
    name: fasas
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt # UE, vicino alla regione Supabase consigliata (eu-central-1, Francoforte)
    plan: free
    healthCheckPath: /salute/
    domains:
      - fasas.online
      - www.fasas.online
    # Nessuna pubblicazione automatica a ogni modifica su GitHub: si aggiorna con «Manual Deploy» dopo il collaudo
    autoDeploy: false
    envVars:
      - key: FASAS_CLOUD
        value: "1"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FASAS_HEALTH_TOKEN
        generateValue: true
      - key: FASAS_ENCRYPTION_KEYS # da fasas_genkey; copia nella busta di custodia
        sync: false
      - key: FASAS_BACKUP_KEY # da fasas_genkey; copia nella busta di custodia
        sync: false
      - key: FASAS_DOMAIN # il primo è il dominio principale; gli altri (e il nome …onrender.com) rimandano lì
        value: fasas.online,www.fasas.online
      - key: DATABASE_URL # Supabase › Connect › Session pooler (porta 5432)
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: "1"
      - key: FASAS_S3_BUCKET
        value: fasas-documenti
      - key: FASAS_S3_ENDPOINT_URL # https://RIFERIMENTO.storage.supabase.co/storage/v1/s3
        sync: false
      - key: FASAS_S3_REGION # regione del progetto Supabase, es. eu-central-1
        sync: false
      - key: FASAS_S3_ACCESS_KEY # Supabase › Storage › Settings › S3 Connection › access key
        sync: false
      - key: FASAS_S3_SECRET_KEY
        sync: false
      - key: FASAS_OFFSITE_ENDPOINT # copia fuori sede dei backup (passo 5 della guida)
        sync: false
      - key: FASAS_OFFSITE_REGION
        sync: false
      - key: FASAS_OFFSITE_BUCKET
        sync: false
      - key: FASAS_OFFSITE_ACCESS_KEY
        sync: false
      - key: FASAS_OFFSITE_SECRET_KEY
        sync: false
      - key: FASAS_OFFSITE_LOCK_DAYS # 0 con un bucket Supabase; 30 con un servizio con Object Lock
        sync: false
      - key: FASAS_ADMIN_USERNAME # primo amministratore, creato al primo avvio
        sync: false
      - key: FASAS_ADMIN_PASSWORD # togliere dopo il primo accesso
        sync: false
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "8"
